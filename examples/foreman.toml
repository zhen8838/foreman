# foreman.toml — mode defaults plus the flag mapping for each agent kind.
# install.sh seeds this as local/foreman.toml (gitignored); edit that copy, not this one.

# Used when the project can't be inferred (running inside its main worktree usually suffices)
default_project = "myproject"


# ── channel: what `foreman say` enforces ──────────────────────────────────────
# Newlines collapse to spaces (in a TUI a newline is enter, which submits half a message).
# max_chars is a mechanical ceiling: collapsed to one line, a longer body won't fit the input
# box. It says nothing about style — "point at paths, don't paste" lives in the templates.
# Set 0 for no limit.
[channel]
max_chars    = 4000
wait_idle_ms = 60000       # wait this long for them to be free; send anyway (--now skips it)


# ── kind → how to start it, and how model / effort / tier become flags ───────
# Adding an agent kind means adding a section, not touching foreman. The agent is started as
#   command + args + flags + <source_env arguments> + <opening prompt>
# so it must take its first message as its last argument and stay interactive.
#
#   command       defaults to the kind's own name
#   trust_prompt  text of the agent's "trust this folder?" dialog; trust_keys accept it.
#                 Agents draw that dialog without reporting a status, so the screen is the only
#                 place to see it — and a fresh worktree is a folder the agent has never seen.

[kinds.codex]
command     = ["codex", "--no-daemon"]                      # hc: without it, commands run outside the terminal
args        = ["--dangerously-bypass-approvals-and-sandbox"]
model_flag  = ["-c", "model={model}"]                       # overrides ~/.codex/config.toml
effort_flag = ["-c", "model_reasoning_effort={effort}"]
tier_flag   = ["-c", "service_tier={tier}"]                 # --tier fast / flex
trust_prompt = ["Trust this folder?", "Do you trust"]
trust_keys   = ["enter"]                                    # "Trust and continue" is preselected

[kinds.claude]
command     = ["claude"]
args        = ["--dangerously-skip-permissions"]
model_flag  = ["--model", "{model}"]
effort_flag = ["--effort", "{effort}"]                      # low|medium|high|xhigh|max
tier_flag   = []                                            # no tier flag; empty means skipped
trust_prompt = ["Yes, I trust this folder"]
trust_keys   = ["down", "enter"]                            # "No, exit" is preselected

[kinds.pi]
command     = ["pi"]
args        = []
model_flag  = ["--model", "{model}"]                        # provider/model, e.g. anthropic/... or openai-codex/...
effort_flag = ["--thinking", "{effort}"]                    # off|minimal|low|medium|high|xhigh|max
tier_flag   = []


# ── mode defaults ─────────────────────────────────────────────────────────────
# Leaving model / effort empty (or deleting them) passes no flag, so the agent reads its own
# config. The command line overrides these; under pair, --review-* overrides review alone.
#
# impl and review deliberately run different models: a reviewer that shares the writer's
# blind spots cannot see past them, and the gate is the whole point of a pair.

[modes.solo.agent]
kind   = "claude"
model  = "claude-opus-5"
effort = "xhigh"

[modes.pair.impl]
kind   = "claude"
model  = "claude-opus-5"
effort = "xhigh"

[modes.pair.review]
kind   = "codex"
model  = "gpt-5.6-terra"
effort = "xhigh"
