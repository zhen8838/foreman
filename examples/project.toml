# One <name>.toml per project, in local/ (gitignored — it is all machine paths).
# The project is inferred by matching `main` against the git toplevel of the cwd; otherwise
# pass --project <name>, or set default_project in local/foreman.toml.

name          = "myproject"
main          = "/home/me/src/myproject"      # main worktree, where the planner talks
worktree_root = "/home/me/src"                # dispatched worktrees are created under here
dir_prefix    = "myproject-"                  # directory name = dir_prefix + task
base          = "main"                        # ref to branch off by default


# ── what each role is told ────────────────────────────────────────────────────
# One free-text block per role, dropped into that role's prompt as its `## Notes`. There is no
# shared fallback: a role you leave out gets no notes at all and its heading disappears.
# Point at the real rules file (**point, don't copy**, or the two will drift) and add the
# commands that file doesn't already give you.

solo_notes = """
The rules are in <worktree>/CONTRIBUTING.md, section "rules for agents". Read it first.

Use this worktree's own .venv:
  .venv/bin/pytest <target> -q -n 8
  .venv/bin/ruff check <changed files>
"""

impl_notes = """
The rules are in <worktree>/CONTRIBUTING.md, section "rules for agents". Read it first.

Use this worktree's own .venv:
  .venv/bin/pytest <target> -q -n 8
  .venv/bin/ruff check <changed files>
"""

review_notes = """
The rules are in <worktree>/CONTRIBUTING.md, section "rules for agents". Read it first.

Read the evidence rather than re-running it; the suite belongs to impl.
"""


# ── hook ──────────────────────────────────────────────────────────────────────
# post_worktree runs after the worktree exists. source_env is sourced in each pane immediately
# before its Agent Session starts (and again on restart). pre_done runs after agents stop but
# before panes, worktree or ledger are removed, so it can archive sessions and release project
# resources. All receive FOREMAN_WORKTREE / FOREMAN_MAIN / FOREMAN_TASK / FOREMAN_BRANCH /
# FOREMAN_MODE / FOREMAN_PROMPT / FOREMAN_PLAN. source_env also receives FOREMAN_ROLE and
# FOREMAN_AGENT_ARGS_FILE; pre_done receives FOREMAN_REMOVE_WORKTREE and FOREMAN_AGENTS_JSON.
# Any non-zero hook result aborts its lifecycle operation.
[hooks]
post_worktree = "local/myproject-post-worktree.sh"
# source_env = "local/myproject-worker-env.sh"
# source_env_timeout_ms = 60000
# pre_done = "local/myproject-pre-done.sh"


# ── templates (optional) ──────────────────────────────────────────────────────
# Templates are found by layered lookup without any config here; see the README. This section
# only exists to point a name somewhere else — two variants of one template, say:
# [templates]
# solo        = "local/templates/quick-solo.md"
# pair-impl   = "local/templates/myproject-impl.md"
# pair-review = "local/templates/strict-review.md"
